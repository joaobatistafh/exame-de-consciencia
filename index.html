    <script>
        (function() {
            try {
                const saved = localStorage.getItem('theme');

                    document.documentElement.classList.add('dark');

            } catch (e) {}
        })();

    // --- ÍCONES EM SVG (sem depender de nenhum CDN externo, sempre aparecem) ---

    function icon(name, cls = '') {
        const content = ICONS[name] || '';
        const spin = name === 'circle-notch' ? ' icon-spin' : '';
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;" class="inline-block align-[-0.125em] shrink-0${spin} ${cls}">${content}</svg>`;
    }

    class App {
        constructor() {
            this.user = null;
            this.isAnonymous = true;
            this.currentView = 'home';
            this.selectedSins = new Set();
            this.currentExamType = null; 
            this.currentExamSaved = false;
            this.currentExamSavedId = null;
            
            this.examsData = [];
            this.confessionsData = [];
            this.customSinsData = [];
            this.dashboardChart = null;
            this.examsTrendChart = null;
            this.confTrendChart = null;
            this.currentCalMonth = new Date().getMonth();
            this.currentCalYear = new Date().getFullYear();
            this.editingSinId = null; // id do pecado personalizado em edição no momento
        }

        async init() {
            this.updateThemeIcon();
            this.renderHeaderAuth();
            this.navigate('home');

            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    const { error } = await supabase.auth.signInAnonymously();
                    if (error) throw error;
                }
            } catch (error) {
                console.warn("Aviso: Login anônimo falhou ou não está habilitado no Supabase. Usando modo offline local.", error);
                this.isAnonymous = true;
                this.user = null;
            }

            supabase.auth.onAuthStateChange(async (event, session) => {
                const u = session?.user;
                if (u) {
                    this.user = u;
                    this.isAnonymous = u.is_anonymous;
                    this.renderHeaderAuth();
                    if (!this.isAnonymous) {
                        await this.fetchUserData();
                    } else {
                        // Limpa dados customizados se voltar pra anônimo
                        this.customSinsData = [];
                    }
                } else {
                    this.user = null;
                    this.isAnonymous = true;
                    this.customSinsData = [];
                    this.renderHeaderAuth();
                }
                
                if(['dashboard', 'confessions'].includes(this.currentView) && this.isAnonymous) {
                     this.navigate('home');
                } else if(this.currentView !== 'home' && this.currentView !== 'exam' && this.currentView !== 'result') {
                    this.navigate(this.currentView);
                } else if(this.currentView === 'exam') {
                    this.navigate('exam', { type: this.currentExamType });
                }
            });
        }

        navigate(view, params = {}) {
            if (view === 'exam' && !params.isEditing) {
                this.selectedSins.clear();
                this.currentExamSaved = false;
                this.currentExamSavedId = null;
            }

            this.currentView = view;
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            window.scrollTo(0, 0);

            if (view === 'home') this.renderHome(container);
            else if (view === 'exam') this.renderExamView(container, params.type);
            else if (view === 'result') this.renderResultView(container);
            else if (view === 'auth') this.renderAuthView(container);
            else if (view === 'dashboard') this.renderDashboardView(container);
            else if (view === 'confessions') this.renderConfessionsView(container);
        }

        toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            try {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            } catch (e) {}
            this.updateThemeIcon();
        }

        updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const iconEl = document.getElementById('theme-toggle-icon');
            if (iconEl) {
                iconEl.innerHTML = icon(isDark ? 'sun' : 'moon', 'text-sm');
            }
        }

        showAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-modal').classList.remove('hidden');
            document.getElementById('alert-modal').classList.add('flex');
        }

        closeAlert() {
            document.getElementById('alert-modal').classList.add('hidden');
            document.getElementById('alert-modal').classList.remove('flex');
        }

        toggleSin(id) {
            if (this.selectedSins.has(id)) {
                this.selectedSins.delete(id);
                document.getElementById(`card-${id}`).classList.remove('selected');
            } else {
                this.selectedSins.add(id);
                document.getElementById(`card-${id}`).classList.add('selected');
            }
        }

        renderHeaderAuth() {
            const section = document.getElementById('auth-header-section');
            if (!this.isAnonymous && this.user) {
                section.innerHTML = `
                    <button onclick="app.navigate('dashboard')" class="text-sm font-semibold text-gray-700 hover:text-red-800 hidden sm:block">${icon('chart-line', 'mr-1')} Dashboard</button>
                    <button onclick="app.navigate('dashboard')" class="text-sm font-semibold text-gray-700 hover:text-red-800 sm:hidden">${icon('chart-line')}</button>
                    
                    <button onclick="app.navigate('confessions')" class="text-sm font-semibold text-gray-700 hover:text-red-800 hidden sm:block">${icon('book-bible', 'mr-1')} Confissões</button>
                    <button onclick="app.navigate('confessions')" class="text-sm font-semibold text-gray-700 hover:text-red-800 sm:hidden">${icon('book-bible')}</button>
                    
                    <button onclick="app.logout()" class="text-sm px-3 py-1 bg-gray-200 rounded-lg hover:bg-gray-300 transition text-gray-800">Sair</button>
                `;
            } else {
                section.innerHTML = `
                    <button onclick="app.navigate('auth')" class="text-sm px-4 py-1.5 bg-red-800 text-white rounded-lg hover:bg-red-900 transition font-medium shadow-sm">Entrar</button>
                `;
            }
        }

        renderHome(container) {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            
            container.innerHTML = `
                <div class="text-center py-10 animate-fade-in">
                    ${icon('hands-praying', 'text-5xl text-red-800 mb-6')}
                    <h1 class="text-3xl font-bold text-gray-900 mb-4">Exame de Consciência</h1>
                    <p class="text-gray-600 mb-10 max-w-lg mx-auto italic leading-relaxed px-4">
                        ${randomQuote}
                    </p>
                    
                    <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto px-4">
                        <div onclick="app.navigate('exam', {type: 'diario'})" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-red-200 cursor-pointer transition flex flex-col items-center group">
                            <div class="w-16 h-16 bg-red-50 text-red-800 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                                ${icon('sun')}
                            </div>
                            <h2 class="text-xl font-bold text-gray-800 mb-2">Exame Diário</h2>
                            <p class="text-sm text-gray-500 text-center">Reflexão rápida sobre o dia para o crescimento nas virtudes e purificação.</p>
                        </div>
                        
                        <div onclick="app.navigate('exam', {type: 'confissao'})" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-red-200 cursor-pointer transition flex flex-col items-center group">
                            <div class="w-16 h-16 bg-red-50 text-red-800 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                                ${icon('church')}
                            </div>
                            <h2 class="text-xl font-bold text-gray-800 mb-2">Para Confissão</h2>
                            <p class="text-sm text-gray-500 text-center">Exame profundo e detalhado baseado nos Mandamentos para o Sacramento.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        renderExamView(container, type) {
            this.currentExamType = type;
            let data = [...dataBank[type]];
            
            // Mesclar pecados customizados se logado
            if (!this.isAnonymous && this.customSinsData.length > 0) {
                const userSinsForType = this.customSinsData.filter(s => s.examType === type);
                data = [...data, ...userSinsForType];
            }

            const title = type === 'diario' ? 'Exame de Consciência Diário' : 'Exame de Consciência para Confissão';
            
            // Agrupar por categoria mantendo a ordem original o máximo possível
            const categories = {};
            data.forEach(item => {
                if(!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item);
            });

            // Quadro Amarelo de Oração Preparatória adicionado aqui no início
            let html = `
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">${title}</h2>
                    </div>
                    <button onclick="app.navigate('home')" class="text-gray-500 hover:text-gray-800 self-start sm:self-auto shrink-0">${icon('arrow-left')} Voltar</button>
                </div>
                
                <div class="bg-yellow-50 border border-yellow-200 p-5 rounded-xl mb-8">
                    <h3 class="font-bold text-yellow-800 mb-2">Ato de presença de Deus</h3>
                    <p class="text-yellow-900 italic text-sm leading-relaxed">
                        Meu Deus, dai-me luz para conhecer os pecados que hoje cometi, as suas causas e os meios de os evitar.
                    </p>
                </div>
            `;

            let catIndex = 0;
            for (const [cat, questions] of Object.entries(categories)) {
                html += `
                    <div class="mb-8">
                    <h3 class="text-lg font-bold text-red-900 mb-3 pb-2 border-b border-red-100 flex items-center gap-2">
                        ${icon('caret-right', 'text-sm')} ${cat}
                    </h3>
                    <div class="space-y-2">
            `;
            
            questions.forEach(q => {
                const isSelected = this.selectedSins.has(q.id);
                const selectedClass = isSelected ? 'selected' : '';
                const isCustom = !!q.user_id; // só itens adicionados pelo usuário podem ser editados/excluídos
                const isEditingThis = isCustom && this.editingSinId === q.id;

                if (isEditingThis) {
                    html += `
                        <div id="card-${q.id}" class="p-3 sm:p-4 rounded-xl border border-red-200 bg-red-50/40 shadow-sm space-y-3">
                            <textarea id="edit-input-${q.id}" rows="2" class="w-full text-sm sm:text-base p-2.5 rounded-lg border border-gray-200 bg-white focus:outline-none focus:border-red-300 focus:ring-1 focus:ring-red-300 resize-none">${q.sin}</textarea>
                            <div class="flex justify-end gap-2">
                                <button onclick="app.cancelEditSin()" class="text-xs font-medium px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 transition">Cancelar</button>
                                <button onclick="app.deleteCustomSin('${q.id}')" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 transition">${icon('trash-can', 'mr-1')}Excluir</button>
                                <button onclick="app.saveEditSin('${q.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-800 text-white hover:bg-red-900 transition">${icon('check', 'mr-1')}Salvar</button>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div id="card-${q.id}" onclick="app.toggleSin('${q.id}')" 
                             class="question-card ${selectedClass} p-3 sm:p-4 rounded-xl border border-gray-200 bg-white cursor-pointer hover:border-red-300 flex gap-3 items-start shadow-sm">
                            <div class="relative w-5 h-5 flex-shrink-0 mt-[2px]">
                                ${icon('circle-check', `check-icon text-[20px] leading-none text-red-500 absolute inset-0 flex items-center justify-center transition-opacity duration-200 ${isSelected ? 'opacity-100' : 'opacity-0'}`)}
                                <div class="w-5 h-5 rounded-full border-2 border-gray-300 absolute inset-0 transition-opacity duration-200 check-placeholder ${isSelected ? 'opacity-0' : 'opacity-100'}"></div>
                            </div>
                            <span class="text-[15px] sm:text-base leading-snug select-none flex-1">${q.q}</span>
                            ${isCustom ? `
                            <button onclick="event.stopPropagation(); app.startEditSin('${q.id}')" title="Editar" class="w-7 h-7 shrink-0 flex items-center justify-center rounded-lg border border-gray-100 text-gray-300 hover:text-gray-500 hover:border-gray-300 hover:bg-gray-50 transition-colors">
                                ${icon('pen', 'text-[11px]')}
                            </button>` : ''}
                        </div>
                    `;
                }
            });

            // Campo para inserir novo pecado (apenas logados)
                if (!this.isAnonymous) {
                    const safeCatId = `new-sin-${catIndex}`;
                    html += `

        async addCustomSin(category, examType, inputId) {
            const inputEl = document.getElementById(inputId);
            const text = inputEl.value.trim();
            if (!text) return;

            if (this.isAnonymous || !this.user) {
                this.showAlert("Aviso", "Você precisa estar logado para salvar pecados personalizados.");
                return;
            }

            inputEl.disabled = true;
            
            try {
                const { data, error } = await supabase
                    .from('custom_sins')
                    .insert([{
                        user_id: this.user.id,
                        category: category,
                        examType: examType,
                        q: text,
                        sin: text,
                        timestamp: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                const newSin = data;
                this.customSinsData.push(newSin);
                this.selectedSins.add(newSin.id); // Auto-seleciona ao criar
                
                // Recarrega a view
                this.navigate('exam', { type: examType });
                
            } catch (error) {
                console.error("Erro ao adicionar pecado customizado:", error);
                this.showAlert("Erro", "Não foi possível adicionar o item.");
                inputEl.disabled = false;
            }
        }

        startEditSin(id) {
            this.editingSinId = id;
            // isEditing:true evita que a seleção do exame em andamento seja apagada
            this.navigate('exam', { type: this.currentExamType, isEditing: true });
        }

        cancelEditSin() {
            this.editingSinId = null;
            this.navigate('exam', { type: this.currentExamType, isEditing: true });
        }

        async saveEditSin(id) {
            const inputEl = document.getElementById(`edit-input-${id}`);
            const newText = inputEl.value.trim();
            if (!newText) {
                this.showAlert("Aviso", "O texto não pode ficar vazio.");
                return;
            }

            try {
                const { error } = await supabase
                    .from('custom_sins')
                    .update({ q: newText, sin: newText })
                    .eq('id', id);

                if (error) throw error;

                const idx = this.customSinsData.findIndex(s => s.id === id);
                if (idx !== -1) {
                    this.customSinsData[idx].q = newText;
                    this.customSinsData[idx].sin = newText;
                }

                this.editingSinId = null;
                this.navigate('exam', { type: this.currentExamType, isEditing: true });

            } catch (error) {
                console.error("Erro ao salvar edição:", error);
                this.showAlert("Erro", "Não foi possível salvar a alteração.");
            }
        }

        async deleteCustomSin(id) {
            try {
                const { error } = await supabase
                    .from('custom_sins')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                this.customSinsData = this.customSinsData.filter(s => s.id !== id);
                this.selectedSins.delete(id);
                this.editingSinId = null;
                this.navigate('exam', { type: this.currentExamType, isEditing: true });

            } catch (error) {
                console.error("Erro ao excluir item:", error);
                this.showAlert("Erro", "Não foi possível excluir o item.");
            }
        }

        async saveExamToDB(sinsArray, isSilent = false) {
            if (!this.user || this.isAnonymous) return;

            try {
                const { data, error } = await supabase
                    .from('exams')
                    .insert([{
                        user_id: this.user.id,
                        type: this.currentExamType,
                        timestamp: new Date().toISOString(),
                        sins: sinsArray
                    }])
                    .select()
                    .single();
                
                if (error) throw error;
                
                this.currentExamSavedId = data.id;
                this.fetchUserData(); 
            } catch (error) {
                console.error("Erro ao salvar exame:", error);
                if (!isSilent) this.showAlert("Erro", "Ocorreu um erro ao salvar o exame.");
            }
        }

        async updateExamInDB(docId, sinsArray) {
            if (!this.user || this.isAnonymous) return;
            try {
                const { error } = await supabase
                    .from('exams')
                    .update({
                        sins: sinsArray,
                        timestamp: new Date().toISOString()
                    })
                    .eq('id', docId);

                if (error) throw error;
                this.fetchUserData();
            } catch(error) {
                console.error("Erro ao atualizar exame", error);
            }
        }

        async fetchUserData() {
            if (!this.user || this.isAnonymous) return;

            try {
                const [examsRes, confRes, customSinsRes] = await Promise.all([
                    supabase.from('exams').select('*').eq('user_id', this.user.id).order('timestamp', { ascending: false }),
                    supabase.from('confessions').select('*').eq('user_id', this.user.id).order('timestamp', { ascending: false }),
                    supabase.from('custom_sins').select('*').eq('user_id', this.user.id)
                ]);

                if (examsRes.error) console.error(examsRes.error);
                if (confRes.error) console.error(confRes.error);
                if (customSinsRes.error) console.error(customSinsRes.error);

                this.examsData = examsRes.data || [];
                this.confessionsData = confRes.data || [];
                this.customSinsData = customSinsRes.data || [];

            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        async handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            let password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-submit-btn');
            
            if (password.length < 6) {
                password = password.padEnd(6, '0'); 
            }

            btn.disabled = true;
            btn.innerHTML = `${icon('circle-notch')} Processando...`;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    if (error.message.includes('Invalid login credentials') || error.status === 400) {
                        const { data: upData, error: upError } = await supabase.auth.signUp({ email, password });
                        if (upError) throw upError;
                        this.showAlert("Conta Criada", "Sua conta foi criada e logada com sucesso.");
                        this.navigate('home');
                    } else {
                        throw error;
                    }
                } else {
                    this.showAlert("Bem-vindo", "Login efetuado com sucesso.");
                    this.navigate('home');
                }
            } catch (error) {
                this.showAlert("Erro", "Falha na autenticação: " + error.message);
                btn.disabled = false;
                btn.innerText = "Entrar / Cadastrar";
            }
        }

            } catch (e) {} 
            
            this.navigate('home');

                </div>
                
                <!-- Novos Gráficos: Tendência -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-800 mb-4 text-sm">Exames Diários (Últimos 6 meses)</h3>
                        <div class="relative h-48 w-full">
                            <canvas id="examsTrendChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-800 mb-4 text-sm">Confissões (Últimos 6 meses)</h3>
                        <div class="relative h-48 w-full">
                            <canvas id="confessionsTrendChart"></canvas>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            this.updateDashboard();
        }

        updateDashboard() {
            const typeFilter = document.getElementById('filter-type').value;
            const timeFilter = document.getElementById('filter-time').value;

            const now = new Date();
            let startDate = new Date(0); 

            if (timeFilter === 'week') startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7);
            else if (timeFilter === 'month') startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            else if (timeFilter === 'semester') startDate = new Date(now.getFullYear(), now.getMonth() - 6, 1);
            else if (timeFilter === 'year') startDate = new Date(now.getFullYear() - 1, now.getMonth(), 1);
            else if (timeFilter === 'last_confession') {
                if (this.confessionsData.length > 0) {
                    startDate = new Date(this.confessionsData[0].timestamp); 
                }
            }

            // Aplicar filtros
            let filteredExams = this.examsData.filter(exam => {
                const examDate = new Date(exam.timestamp);
                const passTime = examDate >= startDate;
                const passType = typeFilter === 'ambos' || exam.type === typeFilter;
                return passTime && passType;
            });

            // Quantidade de exames no mês atual independente do filtro de tempo, mas respeitando o tipo
            const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const monthExams = this.examsData.filter(exam => {
                const examDate = new Date(exam.timestamp);
                const passType = typeFilter === 'ambos' || exam.type === typeFilter;
                return examDate >= currentMonthStart && passType;
            }).length;

            const sinCounts = {};
            filteredExams.forEach(exam => {
                if (exam.sins && Array.isArray(exam.sins)) {
                    exam.sins.forEach(sinText => {
                        sinCounts[sinText] = (sinCounts[sinText] || 0) + 1;
                    });
                }
            });

            document.getElementById('stat-total-exams').innerText = filteredExams.length;
            document.getElementById('stat-month-exams').innerText = monthExams;

            // Preparar dados para os gráficos de tendência (últimos 6 meses)
            const trendLabels = [];
            const examsTrendData = [];
            const confTrendData = [];
            const monthNamesShort = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
            
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const m = d.getMonth();
                const y = d.getFullYear();
                
                trendLabels.push(`${monthNamesShort[m]}/${y.toString().slice(-2)}`);
                
                const eCount = this.examsData.filter(e => {
                    const ed = new Date(e.timestamp);
                    return ed.getMonth() === m && ed.getFullYear() === y && (typeFilter === 'ambos' || e.type === typeFilter);
                }).length;
                examsTrendData.push(eCount);
                
                const cCount = this.confessionsData.filter(c => {
                    const cd = new Date(c.timestamp);
                    return cd.getMonth() === m && cd.getFullYear() === y;
                }).length;
                confTrendData.push(cCount);
            }
            this.renderTrendCharts(trendLabels, examsTrendData, confTrendData);

            // Renderizar Calendário
            this.renderCalendar(this.currentCalYear, this.currentCalMonth, typeFilter);

            // Preparar dados para a tabela
            const sortedSins = Object.entries(sinCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const noDataMsg = document.getElementById('no-data-msg');
            if (sortedSins.length === 0) {
                noDataMsg.classList.remove('hidden');
                document.getElementById('sins-table-container').innerHTML = '';
            } else {
                noDataMsg.classList.add('hidden');
                this.renderSinsTable(sortedSins);
            }
        }

        renderCalendar(year, month, typeFilter) {
            const grid = document.getElementById('calendar-grid');
            const label = document.getElementById('calendar-month-label');
            const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            
            grid.innerHTML = '';
            
            if (label) {
                label.innerText = `${monthNames[month]}/${year.toString().slice(-2)}`;
            }
            
            const firstDay = new Date(year, month, 1).getDay(); // 0(Sun) - 6(Sat)
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date().getDate();
            const currentMonth = new Date().getMonth();

            const examDays = new Set();
            this.examsData.forEach(exam => {
                const examDate = new Date(exam.timestamp);
                if (examDate.getFullYear() === year && examDate.getMonth() === month) {
                    if (typeFilter === 'ambos' || exam.type === typeFilter) {
                        examDays.add(examDate.getDate());
                    }
                }
            });

            const confDays = new Set();
            this.confessionsData.forEach(conf => {
                const confDate = new Date(conf.timestamp);
                if (confDate.getFullYear() === year && confDate.getMonth() === month) {
                    confDays.add(confDate.getDate());
                }
            });

            // Empty cells before 1st day
            for(let i=0; i < firstDay; i++) {
                grid.innerHTML += `<div class="aspect-square"></div>`;
            }

            // Days
            for(let day=1; day <= daysInMonth; day++) {
                const isToday = (day === today && month === currentMonth);
                const hasExam = examDays.has(day);
                const hasConf = confDays.has(day);
                
                let classes = "aspect-square flex items-center justify-center rounded text-[11px] font-medium transition-colors ";
                
                if (hasExam && hasConf) {
                    classes += "bg-red-800 text-white shadow-sm border-b-[3px] border-purple-400";
                } else if (hasConf) {
                    classes += "bg-purple-600 text-white shadow-sm";
                } else if (hasExam) {
                    classes += "bg-red-800 text-white shadow-sm";
                } else if (isToday) {
                    classes += "border border-red-200 text-gray-800 font-bold";
                } else {
                    classes += "bg-gray-50 text-gray-600 hover:bg-gray-100";
                }

                grid.innerHTML += `<div class="${classes}">${day}</div>`;
            }
        }

        prevCalendarMonth() {
            this.currentCalMonth--;
            if (this.currentCalMonth < 0) {
                this.currentCalMonth = 11;
                this.currentCalYear--;
            }
            const typeFilter = document.getElementById('filter-type').value;
            this.renderCalendar(this.currentCalYear, this.currentCalMonth, typeFilter);
        }

        nextCalendarMonth() {
            this.currentCalMonth++;
            if (this.currentCalMonth > 11) {
                this.currentCalMonth = 0;
                this.currentCalYear++;
            }
            const typeFilter = document.getElementById('filter-type').value;
            this.renderCalendar(this.currentCalYear, this.currentCalMonth, typeFilter);
        }

        renderTrendCharts(labels, examsData, confData) {
            // Gráfico de Exames
            const ctxExams = document.getElementById('examsTrendChart').getContext('2d');
            if (this.examsTrendChart) this.examsTrendChart.destroy();
            this.examsTrendChart = new Chart(ctxExams, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Exames',
                        data: examsData,
                        borderColor: '#991b1b',
                        backgroundColor: 'rgba(153, 27, 27, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }, 
                        x: { grid: { display: false } } 
                    }
                }
            });

            // Gráfico de Confissões
            const ctxConf = document.getElementById('confessionsTrendChart').getContext('2d');
            if (this.confTrendChart) this.confTrendChart.destroy();
            this.confTrendChart = new Chart(ctxConf, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Confissões',
                        data: confData,
                        backgroundColor: '#9333ea', // purple-600
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }, 
                        x: { grid: { display: false } } 
                    }
                }
            });
        }

        renderSinsTable(sortedSins) {
            const container = document.getElementById('sins-table-container');
            let html = `
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-gray-500 text-[11px] uppercase tracking-wider">
                            <th class="py-2 px-2 font-semibold">Falta Apontada</th>
                            <th class="py-2 px-2 font-semibold text-center w-24">Vezes</th>
                        </tr>
                    </thead>
                    <tbody class="text-[13px] text-gray-700 divide-y divide-gray-100">
            `;
            
            sortedSins.forEach(([sinText, count]) => {
                html += `
                    <tr class="hover:bg-red-50/50 transition-colors">
                        <td class="py-3 px-2 leading-snug">${sinText}</td>
                        <td class="py-3 px-2 text-center font-bold text-red-800">${count}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        }
    }

    window.app = new App();
    window.app.init();

</script>
</body>
</html>
